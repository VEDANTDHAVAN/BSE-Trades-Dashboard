services:
  postgres:
    image: postgres:17
    container_name: bse-trades-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bse_trades
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_phase2:/var/lib/postgresql/data

volumes:
  postgres_data_phase2:
